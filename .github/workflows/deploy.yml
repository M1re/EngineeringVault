name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main # rebuild the site on every push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so Quartz can read git history for dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Each Quartz plugin is a git clone + npm install + build (~13 min for all of them), so keep
      # them between runs; the cache is rebuilt only when quartz.lock.json changes.
      - name: Cache Quartz plugins
        id: quartz-plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ runner.os }}-${{ hashFiles('quartz.lock.json') }}
      - name: Install Quartz plugins (pinned in quartz.lock.json)
        if: steps.quartz-plugins.outputs.cache-hit != 'true'
        run: npx quartz plugin restore
      - name: Regenerate folder dashboards
        run: node scripts/regen-dashboards.mjs
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
