<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171532"/>
      <stop offset="0.55" stop-color="#3a2c63"/>
      <stop offset="1" stop-color="#0d1c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#4a9eda" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a9eda" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>
  <rect width="1600" height="400" fill="url(#glow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="1600" height="400" fill="url(#glow2)">
    <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#ffffff" stroke-opacity="0.08" fill="none" stroke-width="1.5">
    <path d="M-50 320 Q 400 220 800 300 T 1650 260">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -40 8; 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-50 360 Q 420 260 820 340 T 1650 300">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 40 -6; 0 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
